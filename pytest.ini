[pytest]
; Sem esta config, pytest não tinha rootdir explícito nem marcadores
; registrados — --strict-markers (usado no CI) falhava silenciosamente ao
; aceitar qualquer nome de marker digitado errado.
;
; Vive em pytest.ini (não mais em pyproject.toml) porque o runtime Python da
; Vercel detecta qualquer pyproject.toml presente e tenta rodar `uv lock`
; nele, esperando uma tabela [project] — a nossa só tinha config de pytest,
; sem metadados de pacote, e isso derrubava o build (CFG-07).
testpaths = tests
asyncio_mode = strict
markers =
    asyncio: marca um teste como assíncrono (pytest-asyncio, modo strict)
