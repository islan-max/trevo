[tool.pytest.ini_options]
# Sem esta config, pytest não tinha rootdir explícito nem marcadores
# registrados — --strict-markers (usado no CI) falhava silenciosamente ao
# aceitar qualquer nome de marker digitado errado.
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "asyncio: marca um teste como assíncrono (pytest-asyncio, modo strict)",
]
