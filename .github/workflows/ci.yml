name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

# CI-04: sem isto, pushes em sequência na mesma branch disputavam runners em
# paralelo por nada — só o mais recente importa antes de mergear.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trevo
          POSTGRES_PASSWORD: trevo_test
          POSTGRES_DB: trevo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "5432:5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Arquivos de código ignorados pelo .gitignore
        run: bash scripts/check-ignored-files.sh
      - run: python -m ruff check .
      # SEC-13: -ll escondia achados LOW (o único hoje, em signing.py, é falso
      # positivo com # nosec justificado) — sem o filtro, um LOW novo de
      # verdade agora quebra o build em vez de passar em silêncio.
      - run: python -m bandit -r app -q
      - name: Run tests
        env:
          DATABASE_URL: postgresql://trevo:trevo_test@localhost:5432/trevo_test
          TEST_DATABASE_URL: postgresql://trevo:trevo_test@localhost:5432/trevo_test
          JWT_SECRET_KEY: ci-secret-key-for-testing-only-32chars
          ENVIRONMENT: testing
          ALLOWED_ORIGINS: http://localhost:8000
        # CI-01: pytest_sessionfinish em tests/conftest.py já falha a suíte se
        # algo pular com TEST_DATABASE_URL definida — não precisa mais
        # reexecutar tudo de novo só para grepar "SKIPPED" na saída.
        run: pytest tests/ -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60 -p no:randomly --strict-markers -rs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:money
          npm run build
      # CI-05: não falha o build ainda — hoje isso pegaria next/postcss/sharp,
      # cuja correção exige Next.js 15→16 (major, fora do escopo deste
      # breakpoint). Fica visível no log a cada run até alguém fazer esse
      # upgrade dedicado; então tira o continue-on-error.
      - name: npm audit (não bloqueante até o upgrade do Next.js 16)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - run: bandit -r app/ -q
      # pip-audit substitui o safety check (CLI descontinuado) para auditoria de deps.
      #
      # SEC-15: auditava requirements.txt (faixas em aberto, ex. fastapi>=0.110),
      # mas o Docker publicado instala requirements-lock.txt — o artefato que
      # de fato roda em produção nunca era auditado. python-jose (e o ecdsa
      # transitivo dele, PYSEC-2026-1325, sem correção publicada) saiu do
      # projeto no BP-10, então o --ignore-vuln que existia aqui não se aplica
      # mais.
      - run: pip-audit -r requirements-lock.txt --strict

  # CI-02: publicava imagem no GHCR a cada push em main, e nada consumia essa
  # imagem (o deploy é Vercel — ver docs/guides/deployment.md). Só roda numa
  # tag de release (vX.Y.Z), para quem usa Docker (Railway/Render/self-host)
  # ter uma imagem versionada para além do "latest" sempre mutável.
  build-and-push:
    needs: [test, security-scan]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # O driver `docker` padrão não exporta cache; sem o buildx o passo de build
      # falha com "Cache export is not supported for the docker driver" por causa
      # do cache-to: type=gha abaixo.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
