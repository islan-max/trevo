name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trevo
          POSTGRES_PASSWORD: trevo_test
          POSTGRES_DB: trevo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "5432:5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Arquivos de código ignorados pelo .gitignore
        run: bash scripts/check-ignored-files.sh
      - run: python -m ruff check .
      - run: python -m bandit -r app -ll -q
      - name: Run tests
        env:
          DATABASE_URL: postgresql://trevo:trevo_test@localhost:5432/trevo_test
          TEST_DATABASE_URL: postgresql://trevo:trevo_test@localhost:5432/trevo_test
          JWT_SECRET_KEY: ci-secret-key-for-testing-only-32chars
          ENVIRONMENT: testing
          ALLOWED_ORIGINS: http://localhost:8000
        # -W error::pytest.PytestUnraisableExceptionWarning nao basta: o que
        # importa aqui e que nenhum teste seja pulado. Com Postgres no
        # service, um skip indica configuracao quebrada e deve falhar o build.
        run: pytest tests/ -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60 -p no:randomly --strict-markers -rs
      - name: Falhar se algum teste foi pulado
        env:
          DATABASE_URL: postgresql://trevo:trevo_test@localhost:5432/trevo_test
          TEST_DATABASE_URL: postgresql://trevo:trevo_test@localhost:5432/trevo_test
          JWT_SECRET_KEY: ci-secret-key-for-testing-only-32chars
          ENVIRONMENT: testing
          ALLOWED_ORIGINS: http://localhost:8000
        run: |
          skipped=$(pytest tests/ -q -rs 2>&1 | grep -cE '^SKIPPED' || true)
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped teste(s) pulado(s) com banco disponivel"
            pytest tests/ -q -rs 2>&1 | grep -E '^SKIPPED' || true
            exit 1
          fi
          echo "Nenhum teste pulado."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:money
          npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - run: bandit -r app/ -ll -q
      # pip-audit substitui o safety check (CLI descontinuado) para auditoria de deps.
      #
      # PYSEC-2026-1325 (ecdsa 0.19.2, dependência transitiva de python-jose) é
      # ignorada: não existe versão corrigida publicada e a falha é em operações
      # ECDSA, enquanto os tokens aqui são assinados com HS256 (HMAC) — o caminho
      # vulnerável nunca é executado. Reavaliar quando o ecdsa publicar correção,
      # ou ao migrar de python-jose para PyJWT.
      - run: pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2026-1325

  # CI-02: publicava imagem no GHCR a cada push em main, e nada consumia essa
  # imagem (o deploy é Vercel — ver docs/guides/deployment.md). Só roda numa
  # tag de release (vX.Y.Z), para quem usa Docker (Railway/Render/self-host)
  # ter uma imagem versionada para além do "latest" sempre mutável.
  build-and-push:
    needs: [test, security-scan]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # O driver `docker` padrão não exporta cache; sem o buildx o passo de build
      # falha com "Cache export is not supported for the docker driver" por causa
      # do cache-to: type=gha abaixo.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
